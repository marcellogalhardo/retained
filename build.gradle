// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle.plugin
        classpath libs.gradle.kotlin
        classpath libs.gradle.compose
        classpath libs.gradle.kotlinter
    }
}

plugins {
    alias(libs.plugins.dependency.analysis)
    alias(libs.plugins.binary.compatibility.validator)
}

dependencyAnalysis {
}

apiValidation {
    ignoredProjects += ["sample", "integration-tests"]
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    // KTLint plugin: https://github.com/jeremymailen/kotlinter-gradle
    plugins.apply("org.jmailen.kotlinter")

    plugins.withType(JavaBasePlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
    }

    tasks.withType(Test).configureEach {
        if (hasProperty('failOnNoDiscoveredTests')) {
            failOnNoDiscoveredTests = false
        }
    }
}

apply from: "$rootDir/scripts/publish-root.gradle"

task check {
    dependsOn "installKotlinterPrePushHook"
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
