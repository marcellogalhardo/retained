pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.autonomousapps.dedebug" version "0.1"
    id "com.autonomousapps.dependency-analysis" version "3.18.0" apply false
    id "com.android.library" version '9.3.1' apply false
    id "org.jetbrains.kotlin.android" version "2.4.10" apply false
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

include ':sample'
include ':core'
include ':activity'
include ':fragment'
include ':navigation'
include ':navigation-fragment'
include ':compose'

// Test module, not used by the library consumers.
include ':integration-tests'

// Experimental
include ':navigation-view'
include ':view'
