apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'dev.marcellogalhardo.retained.integrationtests'
    compileSdk 37

    defaultConfig {
        minSdk 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation projects.core
    implementation projects.activity
    implementation projects.fragment

    implementation libs.kotlin.stdlib

    implementation libs.androidx.viewmodel.core
    implementation libs.androidx.viewmodel.savedstate

    implementation libs.androidx.activity.core
    implementation libs.androidx.fragment.core

    // Unit Testing
    testImplementation libs.junit.core
    testImplementation libs.robolectric.core
    testImplementation "org.ow2.asm:asm:9.7"
    testImplementation "org.ow2.asm:asm-commons:9.7"
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.runner
    testImplementation libs.androidx.test.rules
    testImplementation libs.androidx.test.junit
    testImplementation libs.androidx.test.truth
    testImplementation libs.google.truth

    // Android Testing
    implementation libs.androidx.fragment.testing
    androidTestImplementation libs.androidx.test.junit
}
