apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'dev.marcellogalhardo.retained.sample'
    compileSdk 37

    defaultConfig {
        applicationId "com.marcellogalhardo.retainedinstance.sample"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

dependencies {
    implementation projects.core
    implementation projects.activity
    implementation projects.fragment
    implementation projects.view
    implementation projects.compose

    implementation libs.kotlin.stdlib

    implementation libs.androidx.viewmodel.core
    implementation libs.androidx.viewmodel.savedstate

    implementation libs.androidx.activity.core
    implementation libs.androidx.fragment.core

    implementation libs.androidx.appcompat.core
    implementation libs.androidx.core
    implementation libs.androidx.constraintlayout.core

    // Unit Testing
    testImplementation libs.junit.core

    // Android Testing
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso
}
